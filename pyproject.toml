[project]
name = "slaivina"
version = "0.1.0"
description = "Learning project: fine-tune, quantize, and RAG-augment a small open-weight LLM to write in the style of the blog \"Come me su una slavina\"."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See LICENSE" }

# Kept intentionally small/flat for now (scraping phase only). As later
# phases (training/quantize/eval/rag) land, split their heavier deps
# (torch, unsloth, transformers, chromadb, ...) into optional-dependency
# groups below rather than bloating the default install.
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
]
train = [
  "unsloth>=2025.1",
  "datasets>=2.20",
  "torch>=2.4",
]
rag = [
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This is a scripts/-based project, not an importable package (yet) --
# an explicit (empty) include list keeps `uv`/hatchling from erroring out
# looking for a src/slaivina or slaivina/ package directory.
include = ["scripts", "configs", "training", "rag"]
